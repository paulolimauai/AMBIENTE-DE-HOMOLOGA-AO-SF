name: Keep-Alive Render

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping Render Instance
    runs-on: ubuntu-latest
    steps:
      - name: Send Keep-Alive Ping
        run: curl -f -s -A "GitHub-Actions-KeepAlive/1.0" https://ambiente-de-homologa-ao-sf.onrender.com/ping
