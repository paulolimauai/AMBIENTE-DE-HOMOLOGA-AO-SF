/* Guarda de administrador: mesmo token das rotas /api/admin/site/*. Sem ele a página nem chega a abrir. */
(function(){
  var token='';try{token=localStorage.getItem('nexus_token')||''}catch(e){}

      return;
    }
    // Administrador liberado: na PRIMEIRA visita entra direto (o login da página é só a porta de demo;
    // depois disso quem clicou em "Sair" continua vendo a tela de entrada normalmente).
    try{
      if(!localStorage.getItem('nexus_admin_v4')){
        var demo=document.getElementById('demo');
        if(demo) demo.click();
      }
    }catch(e){}
  }).catch(function(){});
})();

<div class="glass scroll"><table><thead><tr><th>Pedido</th><th>Assinante</th><th>Valor</th><th>Forma</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody id="pb"></tbody></table></div></section>`},
acc(){const u=(window.at||'u')==='u',pend=S.users.filter(x=>!x.g).length;
return`<section><div class="row sp"><div><h1>Acessos GLPI</h1><p class="sub">Inclua, altere, bloqueie ou remova usuários e crie perfis de acesso.</p></div><div class="row"><button class="btn" onclick="pull()">⇣ Importar do site</button><button class="btn" onclick="gsync()">Sincronizar GLPI</button><button class="btn p" onclick="${u?'userM()':'profM()'}">＋ ${u?'Novo usuário':'Novo perfil'}</button></div></div>
<div class="row"><button class="btn ${u?'p':''}" onclick="atab('u')">Usuários (${S.users.length})</button><button class="btn ${u?'':'p'}" onclick="atab('p')">Perfis & permissões (${S.profs.length})</button>${pend?`<span class="tag wa">${pend} sem sincronizar</span>`:''}</div>
${u?`<div class="glass pad row"><input id="uq" placeholder="Buscar nome ou e-mail…" style="flex:1;min-width:200px" oninput="urows()"><select id="up" style="width:200px" onchange="urows()"><option value="">Todos os perfis</option>${S.profs.map(p=>`<option>${esc(p.n)}</option>`).join('')}</select></div>
<div class="glass scroll"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Origem</th><th>GLPI</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody id="ub"></tbody></table></div>`
:`<div class="grid g2">${S.profs.map((p,i)=>`<div class="glass pad col"><div class="row sp"><div><h3>${esc(p.n)}</h3><div class="sub" style="font-size:12px;margin:2px 0 0">${S.users.filter(x=>x.p===p.n).length} usuário(s)${p.sys?' • perfil do sistema':''}</div></div><div class="row">${p.sys?'<span class="tag wa">Protegido</span>':`<button class="btn sm" onclick="profM(${i})">Editar</button><button class="btn sm d" onclick="pdel(${i})">Excluir</button>`}</div></div>${AR.map(([k,l])=>`<div class="row sp" style="font-size:12.5px"><span>${l}</span><span class="tag ${p.x[k]>=3?'ok':p.x[k]>=1?'in':'mu'}">${LV[p.x[k]]}</span></div>`).join('')}</div>`).join('')}</div>`}</section>`}};
const T={subs:'Assinaturas',pay:'Pagamentos',acc:'Acessos GLPI'};
function rend(){const m=cur();$('view').innerHTML=V[m]();$('crumb').textContent=T[m];nav();if(m==='subs')rows();if(m==='pay')prows();if(m==='acc')urows()}

/* ===== Assinaturas ===== */
function rows(){const q=($('q').value||'').toLowerCase(),f=$('fs').value;
const L=S.subs.filter(s=>{const p=pinfo(s);return(!f||(f==='blk'?s.s==='Bloqueado':p.c===f))&&[s.n,s.c,s.e,s.cpf].join(' ').toLowerCase().includes(q)});
$('tb').innerHTML=L.map(s=>{const p=pinfo(s);return`<tr><td><b>${esc(s.n)}</b><div class="sub" style="font-size:11.5px;margin:0">${esc(s.c||'Pessoa física')} • ${esc(s.e)}<br>CPF ${esc(mask(s.cpf))}${s.tel?' • '+esc(s.tel):''}</div></td><td>${pcell(s)}</td><td>${s.s==='Bloqueado'?'<span class="tag mu">Bloqueado</span>':p.c==='er'?'<span class="tag er">Vencido</span>':'<span class="tag ok">Liberado</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="ficha(${s.id})">Ficha</button> <button class="btn sm s" onclick="grant(${s.id})">Liberar</button> <button class="btn sm" onclick="blk(${s.id})">${s.s==='Bloqueado'?'Desbloquear':'Bloquear'}</button> <button class="btn sm d" onclick="del(${s.id})">Excluir</button></td></tr>`}).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--m);padding:30px">Nenhum assinante encontrado.</td></tr>'}
function setUser(s,on){const u=S.users.find(x=>x.e.toLowerCase()===s.e.toLowerCase());if(u){u.on=on;u.g=true}else S.users.push({id:Date.now(),n:s.n,e:s.e,t:s.tel||'',p:'Assinante',o:'Site',on,g:true})}
function blk(id){const s=sub(id);s.s=s.s==='Bloqueado'?'Ativo':'Bloqueado';setUser(s,s.s==='Ativo');log(`Acesso de ${s.n} ${s.s==='Ativo'?'liberado':'bloqueado'}.`);save();rend()}
function del(id){const s=sub(id);if(!confirm('Excluir o cadastro de '+s.n+'?'))return;S.subs=S.subs.filter(x=>x.id!==id);log('Assinante removido: '+s.n);save();rend()}
function ficha(id){const s=sub(id),p=pinfo(s),u=S.users.find(x=>x.e.toLowerCase()===s.e.toLowerCase());
const R=[['Nome completo',s.n],['CPF',s.cpf||'—'],['Data de nascimento',s.nasc||'—'],['Celular / WhatsApp',s.tel||'—'],['E-mail (login)',s.e],['Empresa',s.c||'Pessoa física'],['Cadastrado em',s.cad||'—'],['Plano contratado',s.p],['Valor',brl(s.v)],['Validade',s.val||'—'],['Status da conta',s.s],['Acesso GLPI',u?(u.on?'Liberado':'Bloqueado')+' • '+(u.g?'sincronizado':'pendente de sincronizar'):'Não cadastrado no GLPI']];
const H=S.logs.filter(l=>l.x.includes(s.n)).slice(0,5);
modal(`<div class="row sp" style="margin-bottom:4px"><h3 style="font-size:18px">${esc(s.n)}</h3><button class="btn sm" onclick="closeM()">✕</button></div><span class="tag ${p.c}">${esc(p.l)}</span><div class="sub" style="font-size:12px;margin:6px 0 14px">${esc(p.d)}</div><div class="tk">${R.map(r=>`<div class="log" style="justify-content:space-between"><span style="color:var(--m)">${r[0]}</span><b style="text-align:right;font-weight:600">${esc(r[1])}</b></div>`).join('')}</div>${H.length?`<h3 style="margin:14px 0 4px;font-size:13px">Histórico recente</h3>${H.map(l=>`<div class="log"><i>${esc(l.t)}</i><span>${esc(l.x)}</span></div>`).join('')}`:''}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn s" onclick="grant(${s.id})">Liberar Mensal ${brl(S.price)}</button></div>`)}
function grant(id){const pr=S.price,PE=[['+1 hora (cortesia)',1/24],['+24 horas (cortesia)',1],['+7 dias',7],['+30 dias (1 mensalidade)',30],['+1 ano',365],['Vitalício',0]];
modal(`<h3 style="font-size:17px;margin-bottom:4px">Liberar assinatura Nexus Mensal</h3><p class="sub" style="margin-bottom:14px">Valor: <b style="color:var(--t)">${brl(pr)}</b> via Pix. O acesso é liberado no site e no GLPI.</p><form id="f" class="col"><div><label>Assinante</label><select id="gs2">${S.subs.map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${esc(s.n)} — ${esc(s.e)}</option>`).join('')}</select></div><div><label>Período de acesso</label><select id="gd">${PE.map((p,i)=>`<option value="${i}" ${i===3?'selected':''}>${p[0]}</option>`).join('')}</select></div><div><label>Comprovante / ID do Pix (opcional)</label><input id="gr" placeholder="Ex.: E123…"></div><label class="row" style="text-transform:none;font-size:13px;color:var(--t)"><input type="checkbox" id="gp2" checked> Confirmo que o pagamento de ${brl(pr)} foi recebido</label><div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn s">Liberar agora</button></div></form>`);
$('f').onsubmit=e=>{e.preventDefault();const s=sub(+$('gs2').value),i=+$('gd').value,d=PE[i][1];
if(!$('gp2').checked&&i>=3)return toast('Confirme o recebimento do pagamento','var(--r)');
let val='Vitalício';if(d){const x=new Date(Date.now()+d*864e5);val=d<1?x.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):fd(x)}
s.s='Ativo';s.p='Nexus Mensal';s.v=pr;s.val=val;setUser(s,true);if(i>=3)S.pays.unshift({id:'PG-'+String(Date.now()).slice(-5),sid:s.id,n:s.n,v:pr,m:'Pix',st:'Confirmado',d:nowS(),ref:$('gr').value,conf:nowS()});
log(`Assinatura Mensal (${brl(pr)}) liberada para ${s.n} até ${val}${$('gr').value?' • ref. '+$('gr').value:''}.`);save();closeM();rend();toast('Assinatura liberada para '+s.n+' até '+val)}}
function newSub(){modal(`<h3 style="font-size:17px;margin-bottom:14px">Novo assinante</h3><form id="f" class="col"><div><label>Nome completo</label><input id="n" required></div><div><label>Empresa</label><input id="c"></div><div><label>E-mail (login)</label><input id="e" type="email" required></div><div class="row"><div style="flex:1"><label>CPF</label><input id="cp" placeholder="000.000.000-00"></div><div style="flex:1"><label>Nascimento</label><input id="nc" placeholder="dd/mm/aaaa"></div></div><div><label>Celular / WhatsApp</label><input id="tl" placeholder="(62) 90000-0000"></div><div><label>Plano</label><select id="p"><option value="0">Teste grátis (1 dia)</option><option value="1">Nexus Mensal — ${brl(S.price)}</option></select></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Salvar e liberar acesso</button></div></form>`);
$('f').onsubmit=e=>{e.preventDefault();const m=$('p').value==='1',em=$('e').value;
if(S.subs.some(s=>s.e.toLowerCase()===em.toLowerCase()))return toast('E-mail já cadastrado','var(--r)');
const s={id:Date.now(),n:$('n').value,c:$('c').value,e:em,p:m?'Nexus Mensal':'Teste grátis',v:m?S.price:0,s:'Ativo',cpf:$('cp').value,nasc:$('nc').value,tel:$('tl').value,cad:fd(new Date()),val:fd(new Date(Date.now()+(m?30:1)*864e5))};
S.subs.unshift(s);setUser(s,true);log(`Novo assinante: ${s.n} (${s.p}).`);save();closeM();rend();toast('Assinante cadastrado')}}

/* ===== Acessos GLPI ===== */
function atab(t){window.at=t;rend()}
function urows(){if(!$('ub'))return;const q=($('uq').value||'').toLowerCase(),f=$('up').value;
const L=S.users.filter(u=>(!f||u.p===f)&&(u.n+u.e).toLowerCase().includes(q));
$('ub').innerHTML=L.map(u=>`<tr><td><b>${esc(u.n)}</b><div class="sub" style="font-size:11.5px;margin:0">${esc(u.e)}</div>${planTag(u.e)}</td><td><span class="tag ${u.p==='Proprietário'?'wa':'in'}">${esc(u.p)}</span></td><td><span class="tag mu">${esc(u.o)}</span></td><td>${u.g?'<span class="tag ok">Sincronizado</span>':'<span class="tag er">Pendente</span>'}</td><td><span class="tag ${u.on?'ok':'mu'}">${u.on?'Ativo':'Bloqueado'}</span></td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="userM(${u.id})">Editar</button> ${u.p==='Proprietário'?'':`<button class="btn sm" onclick="utog(${u.id})">${u.on?'Bloquear':'Ativar'}</button> <button class="btn sm d" onclick="udel(${u.id})">Remover</button>`}</td></tr>`).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--m);padding:30px">Nenhum usuário encontrado.</td></tr>'}
function userM(id){const u=S.users.find(x=>x.id===id)||{n:'',e:'',t:'',p:'Assinante',on:true},own=u.p==='Proprietário';
modal(`<h3 style="font-size:17px;margin-bottom:14px">${id?'Editar':'Novo'} usuário</h3><form id="f" class="col"><div><label>Nome</label><input id="n" required value="${esc(u.n)}"></div><div><label>E-mail (login único)</label><input id="e" type="email" required value="${esc(u.e)}"></div><div><label>Telefone</label><input id="t" value="${esc(u.t||'')}"></div><div class="row"><div style="flex:1"><label>Perfil</label><select id="p" ${own?'disabled':''}>${S.profs.filter(p=>own||p.n!=='Proprietário').map(p=>`<option ${p.n===u.p?'selected':''}>${esc(p.n)}</option>`).join('')}</select></div><div style="flex:1"><label>Status</label><select id="s"><option value="1" ${u.on?'selected':''}>Ativo</option><option value="0" ${u.on?'':'selected'}>Bloqueado</option></select></div></div><label class="row" style="text-transform:none;font-size:13px;color:var(--t)"><input type="checkbox" id="rp"> Exigir nova senha no próximo login</label><div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Salvar e enviar ao GLPI</button></div></form>`);
$('f').onsubmit=e=>{e.preventDefault();const d={n:$('n').value,e:$('e').value,t:$('t').value,p:own?u.p:$('p').value,on:$('s').value==='1',g:true};
if(S.users.some(x=>x.e.toLowerCase()===d.e.toLowerCase()&&x.id!==id))return toast('E-mail já cadastrado','var(--r)');
if(id)Object.assign(u,d);else S.users.unshift({id:Date.now(),o:'Manual',...d});
log(`Usuário ${d.n} ${id?'alterado':'incluído'} (${d.p}).`);save();closeM();rend();toast('Usuário salvo')}}
function utog(id){const u=S.users.find(x=>x.id===id);u.on=!u.on;log(`Acesso de ${u.n} ${u.on?'liberado':'bloqueado'}.`);save();urows()}
function udel(id){const u=S.users.find(x=>x.id===id);if(!confirm('Remover '+u.n+' do GLPI?'))return;S.users=S.users.filter(x=>x.id!==id);log('Usuário removido: '+u.n);save();rend()}
function pull(){let n=0;S.subs.forEach(s=>{if(!S.users.some(u=>u.e.toLowerCase()===s.e.toLowerCase())){S.users.push({id:Date.now()+n++,n:s.n,e:s.e,t:s.tel||'',p:'Assinante',o:'Site',on:s.s!=='Bloqueado',g:false})}});log(`Importação do site: ${n} usuário(s) novo(s).`);save();rend();toast(n?n+' usuário(s) importado(s) — sincronize com o GLPI':'Nenhum usuário novo para importar')}
function gsync(){const n=S.users.filter(u=>!u.g).length;S.users.forEach(u=>u.g=true);log(`Sincronização GLPI: ${n} usuário(s) enviado(s).`);save();rend();toast(n+' usuário(s) sincronizado(s)')}
function profM(i){const p=i==null?{n:'',x:{t:1,u:0,a:0,r:0,c:0}}:S.profs[i];
modal(`<h3 style="font-size:17px;margin-bottom:14px">${i==null?'Novo':'Editar'} perfil</h3><form id="f" class="col"><div><label>Nome do perfil</label><input id="n" required value="${esc(p.n)}"></div>${AR.map(([k,l])=>`<div class="row sp"><label style="margin:0">${l}</label><select data-x="${k}" style="width:140px">${LV.map((v,j)=>`<option value="${j}" ${p.x[k]===j?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}<div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Salvar perfil</button></div></form>`);
$('f').onsubmit=e=>{e.preventDefault();const n=$('n').value.trim(),x={};document.querySelectorAll('[data-x]').forEach(s=>x[s.dataset.x]=+s.value);
if(S.profs.some((q,j)=>q.n.toLowerCase()===n.toLowerCase()&&j!==i))return toast('Já existe perfil com esse nome','var(--r)');
if(i==null)S.profs.push({n,x});else{const old=S.profs[i].n;S.profs[i]={n,x};S.users.forEach(u=>{if(u.p===old)u.p=n})}
log('Perfil '+n+(i==null?' criado.':' alterado.'));save();closeM();rend()}}
function pdel(i){const p=S.profs[i];if(S.users.some(u=>u.p===p.n))return toast('Há usuários neste perfil. Mova-os antes.','var(--r)');if(!confirm('Excluir o perfil '+p.n+'?'))return;S.profs.splice(i,1);log('Perfil excluído: '+p.n);save();rend()}

/* ===== Pagamentos ===== */
const PS={'Confirmado':'ok','Em análise':'wa','Aguardando':'in','Recusado':'er','Estornado':'er'};
const nowS=()=>new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function prows(){if(!$('pb'))return;const q=($('pq').value||'').toLowerCase(),f=$('pf').value;
const L=S.pays.filter(p=>(!f||p.st===f)&&[p.id,p.n,p.ref].join(' ').toLowerCase().includes(q));
$('pb').innerHTML=L.map(p=>{const s=sub(p.sid);return`<tr><td class="mono" style="font-size:12px">${esc(p.id)}<div class="sub" style="font-size:11px;margin:0;font-family:Inter,sans-serif">${esc(p.d)}</div></td><td><b>${esc(p.n)}</b><div class="sub" style="font-size:11.5px;margin:0">${esc(s?s.e:'cadastro removido')}</div></td><td class="mono">${brl(p.v)}</td><td>${esc(p.m)}${p.ref?`<div class="sub" style="font-size:11px;margin:0">${esc(p.ref)}</div>`:''}</td><td><span class="tag ${PS[p.st]}">${p.st}</span>${p.conf?`<div class="sub" style="font-size:11px;margin:3px 0 0">em ${esc(p.conf)}</div>`:''}</td><td style="text-align:right;white-space:nowrap">${['Em análise','Aguardando'].includes(p.st)?`<button class="btn sm s" onclick="payOk('${p.id}')">Confirmar</button> <button class="btn sm d" onclick="payNo('${p.id}')">Recusar</button>`:p.st==='Confirmado'?`<button class="btn sm d" onclick="payRef('${p.id}')">Estornar</button>`:'<span class="sub" style="font-size:12px">—</span>'}</td></tr>`}).join('')||'<tr><td colspan="6" style="text-align:center;color:var(--m);padding:30px">Nenhum pagamento encontrado.</td></tr>'}
function applyPay(p){const s=sub(p.sid);p.st='Confirmado';p.conf=nowS();if(!s)return;if(s.val!=='Vitalício'){const cur=ptBR(s.val),b=(s.p==='Nexus Mensal'&&cur&&cur>new Date())?cur:new Date();b.setDate(b.getDate()+30);s.val=fd(b)}s.p='Nexus Mensal';s.v=p.v;s.s='Ativo';setUser(s,true)}
function payOk(id){const p=S.pays.find(x=>x.id===id);applyPay(p);const s=sub(p.sid);log(`Pagamento ${p.id} (${brl(p.v)}) confirmado: ${p.n}${s?' — Mensal até '+s.val:''}.`);save();rend();toast('Pagamento confirmado'+(s?' — assinatura até '+s.val:''))}
function payNo(id){const p=S.pays.find(x=>x.id===id);p.st='Recusado';log(`Pagamento ${p.id} recusado: ${p.n}.`);save();rend();toast('Pagamento recusado','var(--w)')}
function payRef(id){const p=S.pays.find(x=>x.id===id),s=sub(p.sid);if(!confirm('Estornar '+brl(p.v)+' de '+p.n+'? A assinatura será encerrada e o acesso GLPI bloqueado.'))return;p.st='Estornado';if(s){s.val=fd(new Date(Date.now()-864e5));setUser(s,false)}log(`Pagamento ${p.id} estornado: ${p.n}.`);save();rend();toast('Pagamento estornado','var(--w)')}
function payNew(){modal(`<h3 style="font-size:17px;margin-bottom:14px">Registrar pagamento</h3><form id="f" class="col"><div><label>Assinante</label><select id="ps">${S.subs.map(s=>`<option value="${s.id}">${esc(s.n)} — ${esc(s.e)}</option>`).join('')}</select></div><div class="row"><div style="flex:1"><label>Valor (R$)</label><input id="pv" type="number" step="0.01" min="0" value="${S.price}"></div><div style="flex:1"><label>Forma</label><select id="pm"><option>Pix</option><option>Transferência</option><option>Dinheiro</option><option>Cartão</option></select></div></div><div><label>Comprovante / referência</label><input id="pr" placeholder="ID do Pix, observação…"></div><div><label>Situação</label><select id="pst"><option value="c">Já recebido — confirmar e liberar 30 dias</option><option value="a">Em análise (conferir depois)</option><option value="w">Aguardando pagamento</option></select></div><div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Registrar</button></div></form>`);
$('f').onsubmit=e=>{e.preventDefault();const s=sub(+$('ps').value),k=$('pst').value,p={id:'PG-'+String(Date.now()).slice(-5),sid:s.id,n:s.n,v:parseFloat($('pv').value)||0,m:$('pm').value,st:k==='a'?'Em análise':'Aguardando',d:nowS(),ref:$('pr').value};
if(k==='c')applyPay(p);S.pays.unshift(p);log(`Pagamento ${p.id} (${brl(p.v)}) registrado para ${s.n}: ${p.st}.`);save();closeM();rend();toast('Pagamento registrado')}}
function savePix(){S.pix={key:$('pk').value,name:$('pn').value};log('Conta de recebimento Pix atualizada.');save();toast('Conta de recebimento salva')}

/* ===== Sessão ===== */
function enter(){$('login').classList.add('hide');$('app').classList.remove('hide');S.auth=true;save();rend()}
$('lf').onsubmit=e=>{e.preventDefault();enter()};$('demo').onclick=enter;
$('out').onclick=()=>{S.auth=false;save();$('app').classList.add('hide');$('login').classList.remove('hide')};
$('rst').onclick=()=>{if(!confirm('Restaurar dados de demonstração?'))return;S=JSON.parse(JSON.stringify(D));S.auth=true;save();rend();toast('Dados restaurados')};
$('mb').onclick=()=>$('nav').classList.toggle('open');
addEventListener('hashchange',()=>S.auth&&rend());
if(S.auth)enter();
</script>
</body>
</html>
