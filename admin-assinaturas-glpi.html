/* Mesmo tema do site principal (site-inicial.html): paletas e chaves idênticas (nexus:cores, nexus-modo,
   nexus-site-fundo). A cor escolhida no Personalizar daqui replica para o site, o financeiro e o GLPI. */
(function(){
  var r=document.documentElement;
  var P=[
    {id:'multicolor',nome:'Multicolor',h:[265,335,190,45]},
    {id:'aurora',nome:'Aurora',h:[250,320,190,280]},
    {id:'oceano',nome:'Oceano',h:[212,188,255,165]},
    {id:'por-do-sol',nome:'Pôr do sol',h:[18,340,45,285]},
    {id:'esmeralda',nome:'Esmeralda',h:[155,185,85,205]},
    {id:'rose',nome:'Rosé',h:[335,285,15,255]},
    {id:'ouro',nome:'Dourado',h:[42,26,50,10]},
    {id:'turquesa',nome:'Turquesa',h:[176,215,135,265]},
    {id:'carmesim',nome:'Carmesim',h:[352,20,285,320]},
    {id:'neon',nome:'Neon',h:[85,150,195,50]}
  ];
  var PADRAO='oceano',HUE_UI={oceano:224},cor={id:PADRAO},modo='auto';
  function g(k){try{return localStorage.getItem(k)}catch(e){return null}}
  function s(k,v){try{localStorage.setItem(k,v)}catch(e){}}
  function hsl2rgb(h,s,l){s/=100;l/=100;var k=function(n){return(n+h/30)%12},a=s*Math.min(l,1-l);var f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)))};return[Math.round(255*f(0)),Math.round(255*f(8)),Math.round(255*f(4))]}
  function lum(c){var v=c.map(function(x){x/=255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*v[0]+.7152*v[1]+.0722*v[2]}
  function hexHs(v){var n=parseInt(v.slice(1),16),R=(n>>16&255)/255,G=(n>>8&255)/255,B=(n&255)/255,mx=Math.max(R,G,B),mn=Math.min(R,G,B),d=mx-mn,h=0;if(d){if(mx===R)h=((G-B)/d)%6;else if(mx===G)h=(B-R)/d+2;else h=(R-G)/d+4;h=Math.round(h*60+360)%360}var l=(mx+mn)/2,sa=d?d/(1-Math.abs(2*l-1)):0;return{h:h,s:Math.round(sa*100)}}
  function achar(h,sa,alvo){var lo=6,hi=94,m,i;for(i=0;i<12;i++){m=(lo+hi)/2;if(lum(hsl2rgb(h,sa,m))<alvo)lo=m;else hi=m}return Math.round((lo+hi)*5)/10}
  function pintarVidro(st,h0,h2,sa){
    var c=function(h,a){return 'hsl('+h+' '+sa+'% '+achar(h,sa,a)+'%)'};
    st.setProperty('--vd1',c(h0,.024));st.setProperty('--vd2',c(h0,.015));st.setProperty('--vd3',c(h2,.018));
    st.setProperty('--vl1',c(h0,.9));st.setProperty('--vl2',c(h0,.82));st.setProperty('--vl3',c(h2,.78));
  }
  function botao(h,sa){
    var esc=lum(hsl2rgb(h,55,9)),L,b;
    function bt(L){return 1.05/(lum(hsl2rgb(h,sa,L))+.05)>=4.6}
    function ed(L){return (lum(hsl2rgb(h,sa,L))+.05)/(esc+.05)>=4.6}
    for(L=62;L>=48;L--){if(bt(L))return{a:L,b:Math.max(L-8,40),t:'#fff'}}
    for(L=66;L>=60;L--){if(ed(L)){b=L;while(b>L-8&&ed(b-1))b--;return{a:L,b:b,t:'hsl('+h+' 55% 9%)'}}}
    return{a:48,b:42,t:'#fff'};
  }
  function pintar(h0,h2,sat){
    var sa=Math.max(70,Math.min(100,sat==null?100:sat)),st=r.style;
    st.setProperty('--h',String(h0));st.setProperty('--h2',String(h2));st.setProperty('--sat',sa+'%');
    st.setProperty('--orb',String(Math.max(.5,Math.min(1,.26/lum(hsl2rgb(h0,sa*.77,57))))));
    var bt=botao(h0,sa);
    st.setProperty('--btn-a','hsl('+h0+' '+sa+'% '+bt.a+'%)');st.setProperty('--btn-b','hsl('+h0+' '+sa+'% '+bt.b+'%)');st.setProperty('--on-brand',bt.t);
    pintarVidro(st,h0,h2,sa);
  }
  function avisar(){if(T.onChange)T.onChange()}
  function escolher(id,salvar){
    var p=P.filter(function(x){return x.id===id})[0]||P.filter(function(x){return x.id===PADRAO})[0];
    cor={id:p.id};pintar(HUE_UI[p.id]||p.h[0],p.h[2],100);
    if(salvar)s('nexus:cores',JSON.stringify({id:p.id}));
    avisar();
  }
  function personalizada(hex,salvar){
    if(!/^#[0-9a-f]{6}$/i.test(hex||''))return;
    var hs=hexHs(hex);cor={id:'custom',hex:hex};pintar(hs.h,(hs.h+36)%360,hs.s);
    if(salvar)s('nexus:cores',JSON.stringify({id:'custom',hex:hex}));
    avisar();
  }
  var mq=window.matchMedia?matchMedia('(prefers-color-scheme: light)'):{matches:false};
  function setModo(m,salvar){
    if(['auto','escuro','claro'].indexOf(m)<0)m='auto';
    modo=m;r.setAttribute('data-mode',m==='claro'||(m==='auto'&&mq.matches)?'light':'dark');
    if(salvar)s('nexus-modo',m);
    avisar();
  }
  if(mq.addEventListener)mq.addEventListener('change',function(){if(modo==='auto')setModo('auto')});
  var FUNDOS=[['padrao','Padrão'],['vidro','Vidro']],fundo='padrao';
  function setFundo(f,salvar){
    if(!FUNDOS.some(function(x){return x[0]===f}))f='padrao';
    fundo=f;r.setAttribute('data-bg',f);
    if(salvar)s('nexus-site-fundo',f);
    avisar();
  }
  var T=window.NxTema={PALETAS:P,PADRAO:PADRAO,FUNDOS:FUNDOS,escolher:escolher,personalizada:personalizada,setModo:setModo,setFundo:setFundo,corAtual:function(){return cor},modo:function(){return modo},fundo:function(){return fundo},onChange:null};
  var salvo=null;try{salvo=JSON.parse(g('nexus:cores'))}catch(e){}
  if(salvo&&salvo.id==='custom'&&/^#[0-9a-f]{6}$/i.test(salvo.hex||''))personalizada(salvo.hex,false);
  else if(salvo&&P.some(function(p){return p.id===salvo.id}))escolher(salvo.id,false);
  else escolher(PADRAO,true);
  setModo(g('nexus-modo')||'auto',false);
  setFundo(g('nexus-site-fundo')||'padrao',false);
})();
</script>
<style>

.bg .o1{width:clamp(18rem,52vw,70rem);aspect-ratio:1;left:-14vw;top:-18vw;background:var(--glow-a);opacity:calc(.32 * var(--orb,1))}
.bg .o2{width:clamp(16rem,46vw,62rem);aspect-ratio:1;right:-12vw;top:30vh;background:var(--glow-b);opacity:calc(.34 * var(--orb,1));animation-duration:36s}

.bg .gr{position:absolute;inset:0;background-image:linear-gradient(var(--tint) 1px,transparent 1px),linear-gradient(90deg,var(--tint) 1px,transparent 1px);background-size:3.5rem 3.5rem;

/* ===== Situação da assinatura ===== */
function pinfo(s){if(!s)return{c:'mu',l:'Sem cadastro no site',d:''};
if(s.val==='Vitalício')return{c:'ok',l:s.p+' • Vitalício',d:'sem vencimento'};
const d=ptBR(s.val);
if(d&&d<new Date())return{c:'er',l:s.p+' • Expirado',d:'expirou em '+s.val};
if(s.p==='Teste grátis')return{c:'wa',l:'Teste grátis • 1 dia',d:'válido até '+(s.val||'—')+' — ainda não contratou o Mensal'};
return{c:'ok',l:s.p+' • '+brl(s.v),d:'válido até '+(s.val||'—')}}
const pcell=s=>{const p=pinfo(s);return`<span class="tag ${p.c}">${esc(p.l)}</span><div class="sub" style="font-size:11px;margin:3px 0 0">${esc(p.d)}</div>`};
const mask=c=>c?String(c).replace(/^(\d{3})\.?\d{3}\.?\d{3}-?(\d{2})$/,'$1.•••.•••-$2'):'—';
const planTag=e=>{const s=S.subs.find(x=>x.e.toLowerCase()===String(e).toLowerCase());if(!s)return'';const p=pinfo(s);return`<div style="margin-top:4px"><span class="tag ${p.c}">${esc(p.l)}</span></div>`};

/* ===== Menu ===== */
const IC={subs:'<path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2M9 11a4 4 0 100-8 4 4 0 000 8zM23 21v-2a4 4 0 00-3-3.9M16 3.1a4 4 0 010 7.8"/>',pay:'<path d="M2 5h20v14H2zM2 10h20"/>',acc:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/>'};

/* ===== Views ===== */
const AR=[['t','Chamados'],['u','Usuários e perfis'],['a','Ativos (CMDB)'],['r','Relatórios'],['c','Configuração GLPI']],LV=['Nenhum','Ler','Editar','Total'];
const V={
subs(){const P=S.subs.map(pinfo),pag=S.subs.filter((s,i)=>P[i].c==='ok'&&s.p!=='Teste grátis'),teste=P.filter(p=>p.c==='wa').length,exp=P.filter(p=>p.c==='er').length;
return`<section><div class="row sp"><div><h1>Assinaturas</h1><p class="sub">Cadastros do site, plano atual de cada pessoa e liberação de acesso.</p></div><div class="row"><button class="btn s" onclick="grant()">✓ Liberar assinatura Mensal</button><button class="btn p" onclick="newSub()">＋ Novo assinante</button></div></div>
<div class="grid g4">${[['Assinantes pagantes',pag.length,'Mensal ativo'],['Em teste (1 dia)',teste,'Aguardando contratar'],['Expirados',exp,'Precisam renovar'],['Receita mensal',brl(pag.reduce((x,s)=>x+s.v,0)),'Recorrência atual']].map(k=>`<div class="glass pad kpi"><small style="text-transform:uppercase;font-weight:700;letter-spacing:.06em">${k[0]}</small><div class="v">${k[1]}</div><small>${k[2]}</small></div>`).join('')}</div>
<div class="glass pad row"><input id="q" placeholder="Buscar por nome, CPF, empresa ou e-mail…" style="flex:1;min-width:200px" oninput="rows()"><select id="fs" style="width:190px" onchange="rows()"><option value="">Todas as situações</option><option value="wa">Em teste</option><option value="ok">Ativas</option><option value="er">Expiradas</option><option value="blk">Acesso bloqueado</option></select><div class="row" style="gap:6px"><span class="sub" style="margin:0;font-size:12px">Mensalidade R$</span><input type="number" step="0.01" min="0" value="${S.price}" style="width:90px" onchange="S.price=parseFloat(this.value)||0;save();rend();toast('Valor da mensalidade atualizado')"></div></div>
<div class="glass scroll"><table><thead><tr><th>Assinante</th><th>Plano atual</th><th>Acesso</th><th style="text-align:right">Ações</th></tr></thead><tbody id="tb"></tbody></table></div></section>`},
pay(){const P=S.pays,sum=st=>P.filter(p=>p.st===st).reduce((x,p)=>x+p.v,0),cnt=st=>P.filter(p=>p.st===st).length;
return`<section><div class="row sp"><div><h1>Pagamentos</h1><p class="sub">Confirme comprovantes Pix, registre recebimentos e libere a assinatura automaticamente.</p></div><button class="btn p" onclick="payNew()">＋ Registrar pagamento</button></div>
<div class="grid g4">${[['Recebido',brl(sum('Confirmado')),cnt('Confirmado')+' pagamento(s) confirmado(s)'],['Em análise',cnt('Em análise'),brl(sum('Em análise'))+' aguardando conferência'],['Aguardando Pix',cnt('Aguardando'),brl(sum('Aguardando'))+' ainda não pago'],['Recusados / estornados',cnt('Recusado')+cnt('Estornado'),brl(sum('Recusado')+sum('Estornado'))]].map(k=>`<div class="glass pad kpi"><small style="text-transform:uppercase;font-weight:700;letter-spacing:.06em">${k[0]}</small><div class="v">${k[1]}</div><small>${k[2]}</small></div>`).join('')}</div>
<div class="grid g2"><div class="glass pad col"><h3>Conta de recebimento (Pix)</h3><div><label>Chave Pix</label><input id="pk" value="${esc(S.pix.key)}" placeholder="Celular, e-mail, CPF/CNPJ ou chave aleatória"></div><div><label>Favorecido</label><input id="pn" value="${esc(S.pix.name)}" placeholder="Nome do titular"></div><div class="row sp"><span class="sub" style="margin:0">Mensalidade: <b style="color:var(--t)">${brl(S.price)}</b></span><button class="btn p" onclick="savePix()">Salvar conta</button></div></div>

<div class="glass pad row"><input id="pq" placeholder="Buscar por pedido, nome ou referência…" style="flex:1;min-width:200px" oninput="prows()"><select id="pf" style="width:190px" onchange="prows()"><option value="">Todos os status</option><option>Em análise</option><option>Aguardando</option><option>Confirmado</option><option>Recusado</option><option>Estornado</option></select></div>
<div class="glass scroll"><table><thead><tr><th>Pedido</th><th>Assinante</th><th>Valor</th><th>Forma</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody id="pb"></tbody></table></div></section>`},

<div class="row"><button class="btn ${u?'p':''}" onclick="atab('u')">Usuários (${S.users.length})</button><button class="btn ${u?'':'p'}" onclick="atab('p')">Perfis & permissões (${S.profs.length})</button>${pend?`<span class="tag wa">${pend} sem sincronizar</span>`:''}</div>
${u?`<div class="glass pad row"><input id="uq" placeholder="Buscar nome ou e-mail…" style="flex:1;min-width:200px" oninput="urows()"><select id="up" style="width:200px" onchange="urows()"><option value="">Todos os perfis</option>${S.profs.map(p=>`<option>${esc(p.n)}</option>`).join('')}</select></div>
<div class="glass scroll"><table><thead><tr><th>Usuário</th><th>Perfil</th><th>Origem</th><th>GLPI</th><th>Status</th><th style="text-align:right">Ações</th></tr></thead><tbody id="ub"></tbody></table></div>`
:`<div class="grid g2">${S.profs.map((p,i)=>`<div class="glass pad col"><div class="row sp"><div><h3>${esc(p.n)}</h3><div class="sub" style="font-size:12px;margin:2px 0 0">${S.users.filter(x=>x.p===p.n).length} usuário(s)${p.sys?' • perfil do sistema':''}</div></div><div class="row">${p.sys?'<span class="tag wa">Protegido</span>':`<button class="btn sm" onclick="profM(${i})">Editar</button><button class="btn sm d" onclick="pdel(${i})">Excluir</button>`}</div></div>${AR.map(([k,l])=>`<div class="row sp" style="font-size:12.5px"><span>${l}</span><span class="tag ${p.x[k]>=3?'ok':p.x[k]>=1?'in':'mu'}">${LV[p.x[k]]}</span></div>`).join('')}</div>`).join('')}</div>`}</section>`}};
const T={subs:'Assinaturas',pay:'Pagamentos',acc:'Acessos GLPI'};
function rend(){const m=cur();$('view').innerHTML=V[m]();$('crumb').textContent=T[m];nav();if(m==='subs')rows();if(m==='pay')prows();if(m==='acc')urows()}

/* ===== Assinaturas ===== */
function rows(){const q=($('q').value||'').toLowerCase(),f=$('fs').value;
const L=S.subs.filter(s=>{const p=pinfo(s);return(!f||(f==='blk'?s.s==='Bloqueado':p.c===f))&&[s.n,s.c,s.e,s.cpf].join(' ').toLowerCase().includes(q)});
$('tb').innerHTML=L.map(s=>{const p=pinfo(s);return`<tr><td><b>${esc(s.n)}</b><div class="sub" style="font-size:11.5px;margin:0">${esc(s.c||'Pessoa física')} • ${esc(s.e)}<br>CPF ${esc(mask(s.cpf))}${s.tel?' • '+esc(s.tel):''}</div></td><td>${pcell(s)}</td><td>${s.s==='Bloqueado'?'<span class="tag mu">Bloqueado</span>':p.c==='er'?'<span class="tag er">Vencido</span>':'<span class="tag ok">Liberado</span>'}</td><td style="text-align:right;white-space:nowrap"><button class="btn sm" onclick="ficha(${s.id})">Ficha</button> <button class="btn sm s" onclick="grant(${s.id})">Liberar</button> <button class="btn sm" onclick="blk(${s.id})">${s.s==='Bloqueado'?'Desbloquear':'Bloquear'}</button> <button class="btn sm d" onclick="del(${s.id})">Excluir</button></td></tr>`}).join('')||'<tr><td colspan="4" style="text-align:center;color:var(--m);padding:30px">Nenhum assinante encontrado.</td></tr>'}

function ficha(id){const s=sub(id),p=pinfo(s),u=S.users.find(x=>x.e.toLowerCase()===s.e.toLowerCase());
const R=[['Nome completo',s.n],['CPF',s.cpf||'—'],['Data de nascimento',s.nasc||'—'],['Celular / WhatsApp',s.tel||'—'],['E-mail (login)',s.e],['Empresa',s.c||'Pessoa física'],['Cadastrado em',s.cad||'—'],['Plano contratado',s.p],['Valor',brl(s.v)],['Validade',s.val||'—'],['Status da conta',s.s],['Acesso GLPI',u?(u.on?'Liberado':'Bloqueado')+' • '+(u.g?'sincronizado':'pendente de sincronizar'):'Não cadastrado no GLPI']];
const H=S.logs.filter(l=>l.x.includes(s.n)).slice(0,5);
modal(`<div class="row sp" style="margin-bottom:4px"><h3 style="font-size:18px">${esc(s.n)}</h3><button class="btn sm" onclick="closeM()">✕</button></div><span class="tag ${p.c}">${esc(p.l)}</span><div class="sub" style="font-size:12px;margin:6px 0 14px">${esc(p.d)}</div><div class="tk">${R.map(r=>`<div class="log" style="justify-content:space-between"><span style="color:var(--m)">${r[0]}</span><b style="text-align:right;font-weight:600">${esc(r[1])}</b></div>`).join('')}</div>${H.length?`<h3 style="margin:14px 0 4px;font-size:13px">Histórico recente</h3>${H.map(l=>`<div class="log"><i>${esc(l.t)}</i><span>${esc(l.x)}</span></div>`).join('')}`:''}<div class="row" style="justify-content:flex-end;margin-top:14px"><button class="btn s" onclick="grant(${s.id})">Liberar Mensal ${brl(S.price)}</button></div>`)}
function grant(id){const pr=S.price,PE=[['+1 hora (cortesia)',1/24],['+24 horas (cortesia)',1],['+7 dias',7],['+30 dias (1 mensalidade)',30],['+1 ano',365],['Vitalício',0]];
modal(`<h3 style="font-size:17px;margin-bottom:4px">Liberar assinatura Nexus Mensal</h3><p class="sub" style="margin-bottom:14px">Valor: <b style="color:var(--t)">${brl(pr)}</b> via Pix. O acesso é liberado no site e no GLPI.</p><form id="f" class="col"><div><label>Assinante</label><select id="gs2">${S.subs.map(s=>`<option value="${s.id}" ${s.id===id?'selected':''}>${esc(s.n)} — ${esc(s.e)}</option>`).join('')}</select></div><div><label>Período de acesso</label><select id="gd">${PE.map((p,i)=>`<option value="${i}" ${i===3?'selected':''}>${p[0]}</option>`).join('')}</select></div><div><label>Comprovante / ID do Pix (opcional)</label><input id="gr" placeholder="Ex.: E123…"></div><label class="row" style="text-transform:none;font-size:13px;color:var(--t)"><input type="checkbox" id="gp2" checked> Confirmo que o pagamento de ${brl(pr)} foi recebido</label><div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn s">Liberar agora</button></div></form>`);
$('f').onsubmit=e=>{e.preventDefault();const s=sub(+$('gs2').value),i=+$('gd').value,d=PE[i][1];
if(!$('gp2').checked&&i>=3)return toast('Confirme o recebimento do pagamento','var(--r)');
let val='Vitalício';if(d){const x=new Date(Date.now()+d*864e5);val=d<1?x.toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}):fd(x)}
s.s='Ativo';s.p='Nexus Mensal';s.v=pr;s.val=val;setUser(s,true);if(i>=3)S.pays.unshift({id:'PG-'+String(Date.now()).slice(-5),sid:s.id,n:s.n,v:pr,m:'Pix',st:'Confirmado',d:nowS(),ref:$('gr').value,conf:nowS()});

modal(`<h3 style="font-size:17px;margin-bottom:14px">${id?'Editar':'Novo'} usuário</h3><form id="f" class="col"><div><label>Nome</label><input id="n" required value="${esc(u.n)}"></div><div><label>E-mail (login único)</label><input id="e" type="email" required value="${esc(u.e)}"></div><div><label>Telefone</label><input id="t" value="${esc(u.t||'')}"></div><div class="row"><div style="flex:1"><label>Perfil</label><select id="p" ${own?'disabled':''}>${S.profs.filter(p=>own||p.n!=='Proprietário').map(p=>`<option ${p.n===u.p?'selected':''}>${esc(p.n)}</option>`).join('')}</select></div><div style="flex:1"><label>Status</label><select id="s"><option value="1" ${u.on?'selected':''}>Ativo</option><option value="0" ${u.on?'':'selected'}>Bloqueado</option></select></div></div><label class="row" style="text-transform:none;font-size:13px;color:var(--t)"><input type="checkbox" id="rp"> Exigir nova senha no próximo login</label><div class="row" style="justify-content:flex-end"><button type="button" class="btn" onclick="closeM()">Cancelar</button><button class="btn p">Salvar e enviar ao GLPI</button></div></form>`);

function profM(i){const p=i==null?{n:'',x:{t:1,u:0,a:0,r:0,c:0}}:S.profs[i];

const nowS=()=>new Date().toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function prows(){if(!$('pb'))return;const q=($('pq').value||'').toLowerCase(),f=$('pf').value;
const L=S.pays.filter(p=>(!f||p.st===f)&&[p.id,p.n,p.ref].join(' ').toLowerCase().includes(q));

$('f').onsubmit=e=>{e.preventDefault();const s=sub(+$('ps').value),k=$('pst').value,p={id:'PG-'+String(Date.now()).slice(-5),sid:s.id,n:s.n,v:parseFloat($('pv').value)||0,m:$('pm').value,st:k==='a'?'Em análise':'Aguardando',d:nowS(),ref:$('pr').value};
if(k==='c')applyPay(p);S.pays.unshift(p);log(`Pagamento ${p.id} (${brl(p.v)}) registrado para ${s.n}: ${p.st}.`);save();closeM();rend();toast('Pagamento registrado')}}

/* ===== Sessão ===== */
function enter(){$('login').classList.add('hide');$('app').classList.remove('hide');S.auth=true;save();rend()}
/* Login REAL: valida e-mail e senha no mesmo /api/login do sistema e exige perfil Administrador.
   O token fica em nexus_token (mesmo do app), então as rotas /api/admin/* continuam protegidas. */
$('lf').onsubmit=function(e){
  e.preventDefault();
  var em=(this.querySelector('input[type="email"]')||{}).value||'';
  var pw=(this.querySelector('input[type="password"]')||{}).value||'';
  var err=$('lerr'); if(err){err.style.display='none';err.textContent='';}
  var btn=this.querySelector('button.btn.p'); if(btn)btn.disabled=true;
  fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})})
  .then(function(r){return r.json().then(function(d){return{s:r.status,d:d}})})
  .then(function(res){
    if(btn)btn.disabled=false;
    var d=res.d||{};
    if(d.success&&d.token){
      var u=d.user||{};
      if(u.role!=='Administrador'){
        if(err){err.textContent='Esta conta não é administradora. Acesso permitido apenas a administradores.';err.style.display='block';}
        return;
      }
      try{
        localStorage.setItem('nexus_token',d.token);
        localStorage.setItem('nexus_cached_user',JSON.stringify(u));
        localStorage.setItem('nexus_session',JSON.stringify({email:u.email}));
        sessionStorage.setItem('nexus_session_active','true');
        localStorage.setItem('nexus_login_v5','true');
      }catch(_){}
      enter();
      return;
    }
    var msg=(d&&d.error)?d.error:'Não foi possível entrar. Verifique e-mail e senha.';
    if(err){err.textContent=msg;err.style.display='block';}
  })
  .catch(function(){
    if(btn)btn.disabled=false;
    if(err){err.textContent='Falha de conexão com o servidor. Tente novamente.';err.style.display='block';}
  });
};
$('demo').onclick=enter;
$('out').onclick=()=>{S.auth=false;save();$('app').classList.add('hide');$('login').classList.remove('hide')};
$('rst').onclick=()=>{if(!confirm('Restaurar dados de demonstração?'))return;S=JSON.parse(JSON.stringify(D));S.auth=true;save();rend();toast('Dados restaurados')};
$('mb').onclick=()=>$('nav').classList.toggle('open');
addEventListener('hashchange',()=>S.auth&&rend());
if(S.auth)enter();

<script>
/* Guarda de administrador (roda depois do script principal):
   - sem token de sessão: garante que só a tela de login apareça;
   - com token: confirma no servidor que é administrador; se não for, volta para o login;
   - admin confirmado na primeira visita: entra direto no painel. */
(function(){
  function showLogin(){
    try{ if(typeof S!=='undefined'&&S){ S.auth=false; save(); } }catch(e){}
    var l=document.getElementById('login'); if(l) l.classList.remove('hide');
    var a=document.getElementById('app'); if(a) a.classList.add('hide');
  }
  var token='';try{token=localStorage.getItem('nexus_token')||''}catch(e){}
  if(!token){ showLogin(); return; }
  fetch('/api/admin/site/files',{headers:{Authorization:'Bearer '+token}}).then(function(r){
    if(r.status===401||r.status===403){ showLogin(); return; }
    try{
      if(!localStorage.getItem('nexus_admin_v4')){
        var demo=document.getElementById('demo');
        if(demo) demo.click();
      }
    }catch(e){}
  }).catch(function(){ showLogin(); });
})();
</script>
<script>
/* Personalizar: mesma lógica do site principal (site-inicial.js). Escreve nas mesmas chaves
   (nexus:cores, nexus-modo, nexus-site-fundo), então a escolha aqui replica para o site,
   o financeiro Nexus e o GLPI — e permanece até ser alterada de novo. */
(function(){
  var T=window.NxTema; if(!T) return;
  var D=document;
  function $(i){return D.getElementById(i)}
  function qa(s){return Array.prototype.slice.call(D.querySelectorAll(s))}
  function montarCores(box){
    if(!box) return;
    var cor=function(h){return 'hsl('+h+' 95% 58%)'};
    T.PALETAS.forEach(function(p){
      var b=D.createElement('button');
      b.type='button'; b.className='sw'; b.dataset.id=p.id; b.title=p.nome;
      b.setAttribute('aria-label','Paleta '+p.nome); b.setAttribute('aria-pressed','false');
      b.style.setProperty('--c','linear-gradient(135deg,'+cor(p.h[0])+' 0 34%,'+cor(p.h[1])+' 34% 67%,'+cor(p.h[2])+' 67%)');
      b.addEventListener('click',function(){T.escolher(p.id,true)});
      box.appendChild(b);
    });
    var l=D.createElement('label');
    l.className='sw sw-c'; l.title='Cor personalizada'; l.setAttribute('aria-pressed','false');
    l.innerHTML='<input type="color" value="#4f7cff" aria-label="Escolher cor personalizada">';
    l.querySelector('input').addEventListener('input',function(){T.personalizada(this.value,true)});
    box.appendChild(l);
  }
  function montarModos(box){
    if(!box) return;
    [['auto','Automático'],['escuro','Escuro'],['claro','Claro']].forEach(function(m){
      var b=D.createElement('button');
      b.type='button'; b.className='chip'; b.dataset.m=m[0]; b.textContent=m[1]; b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){T.setModo(m[0],true)});
      box.appendChild(b);
    });
  }
  function montarFundos(box){
    if(!box) return;
    T.FUNDOS.forEach(function(f){
      var b=D.createElement('button');
      b.type='button'; b.className='chip'; b.dataset.f=f[0]; b.textContent=f[1]; b.setAttribute('aria-pressed','false');
      b.addEventListener('click',function(){T.setFundo(f[0],true)});
      box.appendChild(b);
    });
  }
  function sincronizar(){
    var cor=T.corAtual(), modo=T.modo(), fundo=T.fundo();
    qa('.chip[data-f]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.f===fundo))});
    qa('.sw[data-id]').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.id===cor.id))});
    qa('.sw-c').forEach(function(l){
      l.setAttribute('aria-pressed',String(cor.id==='custom'));
      if(cor.id==='custom'&&cor.hex){var i=l.querySelector('input');if(i)i.value=cor.hex}
    });
    qa('.chip[data-m]').forEach(function(c){c.setAttribute('aria-pressed',String(c.dataset.m===modo))});
  }
  qa('[data-cores]').forEach(montarCores);
  qa('[data-modos]').forEach(montarModos);
  qa('[data-fundos]').forEach(montarFundos);
  T.onChange=sincronizar; sincronizar();
  var btn=$('cfg-btn'), pop=$('cfg-pop');
  if(btn&&pop){
    function abrir(v){pop.hidden=!v;btn.setAttribute('aria-expanded',String(v))}
    btn.addEventListener('click',function(e){e.stopPropagation();abrir(pop.hidden)});
    pop.addEventListener('click',function(e){e.stopPropagation()});
    D.addEventListener('click',function(){abrir(false)});
    D.addEventListener('keydown',function(e){if(e.key==='Escape'&&!pop.hidden){abrir(false);btn.focus()}});
  }
  var reset=$('cfg-reset');
  if(reset) reset.addEventListener('click',function(){T.escolher(T.PADRAO,true);T.setModo('auto',true);T.setFundo('padrao',true)});
})();
</script>
