services:
  - type: web
    name: sistema-financeiro
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --no-audit --omit=optional || npm install --no-audit
    startCommand: npm start
    # O Render chama /ping (resposta 200 sem tocar em banco): reinicia a instância que parar de responder e só troca a versão
    # nova no deploy depois que ela responde (sem derrubar o site a cada push).
    healthCheckPath: /ping
    autoDeploy: true
    disk:
      name: nexus-cadastro-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: NEXUS_DATA_DIR
        value: /var/data
      # Segredos: gerenciados no painel do Render (Environment), nunca no repositorio.
      # sync:false = o blueprint declara a variavel mas NAO grava o valor (ele fica no dashboard).
      - key: NEXUS_SYNC_TOKEN
        sync: false
      # E-mail da conta proprietaria (acesso total). Fica so no painel e no .env do PC: nunca no codigo, no HTML do site nem no Git.
      - key: NEXUS_OWNER_EMAIL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false

